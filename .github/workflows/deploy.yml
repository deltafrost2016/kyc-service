name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write # required for OIDC -> AWS role assumption
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ap-south-1
      STACK_NAME: kyc-service-prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: SAM build
        run: sam build -t infra/template.yaml

      # RDS doesn't exist yet on the first run, so migrations can't happen
      # before this step (chicken-and-egg) — they run afterwards instead,
      # once the DB endpoint is a known stack output.
      - name: SAM deploy
        run: |
          sam deploy \
            --stack-name "$STACK_NAME" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --region "$AWS_REGION" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              VpcId="${{ secrets.VPC_ID }}" \
              PublicSubnetIds="${{ secrets.PUBLIC_SUBNET_IDS }}" \
              DbMasterUsername="${{ secrets.DB_MASTER_USERNAME }}" \
              DbMasterPassword="${{ secrets.DB_MASTER_PASSWORD }}" \
              GeminiApiKey="${{ secrets.GEMINI_API_KEY }}"

      - name: Run migrations against RDS
        run: |
          ENDPOINT=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='DbEndpoint'].OutputValue" \
            --output text)
          export DATABASE_URL="postgres://${{ secrets.DB_MASTER_USERNAME }}:${{ secrets.DB_MASTER_PASSWORD }}@${ENDPOINT}:5432/docanalysis"
          export DB_SSL=true
          npm run migrate
