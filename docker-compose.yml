# Backing services only (Postgres + LocalStack). Application compute
# (api + workers) runs as AWS Lambda functions via `sam local` against this
# same compose network — see template.yaml and `npm run sam:local:api` /
# `npm run sam:local:invoke:*`. Migrations run from the host via
# `npm run migrate` (against DATABASE_URL=...@localhost:5432/...) for local
# dev; CI/CD runs them as part of the GitHub Actions deployment workflow.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docanalysis
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d docanalysis']
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    # community.localstack.io's own PERSISTENCE=1 is Pro-only and no-ops on
    # this image; gresau/localstack-persist is a drop-in community build that
    # actually persists SQS/SNS/S3 state across restarts (saved to
    # /persisted-data), so LocalStack-restart during `sam local` invokes
    # doesn't lose the queues/topic/bucket set up by init-resources.sh.
    image: gresau/localstack-persist:3
    environment:
      SERVICES: sqs,sns,s3
      DEFAULT_REGION: ap-south-1
      LS_LOG: warn
    ports:
      - '4566:4566'
    volumes:
      - ./localstack/init-resources.sh:/etc/localstack/init/ready.d/init-resources.sh
      - localstack-data:/persisted-data
    healthcheck:
      test: ['CMD-SHELL', 'awslocal sqs list-queues || exit 1']
      interval: 120s
      timeout: 5s
      retries: 15

volumes:
  localstack-data:
