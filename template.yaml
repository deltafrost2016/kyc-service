# Local dev tooling only (sam local / sam build) — NOT a production deployment
# artifact; production IaC is owned elsewhere. This template exists purely so
# `sam build` (esbuild) and `sam local invoke` / `sam local start-api` can
# exercise the same six Lambda handlers (src/lambda/*Handler.ts) that will
# eventually be packaged (zip + esbuild) for real deployment by that separate
# IaC. Local env values (LocalStack endpoints, dummy creds) live in env.json,
# not here — pass them with `--env-vars env.json`. LocalStack hostnames only
# resolve if the SAM local container joins the docker-compose network, e.g.:
#   sam local invoke DedupFunction --docker-network kyc-service_default --env-vars env.json -e events/dedup-sample.json
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  kyc-service Lambda functions (local-dev SAM template only).

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 256
    # These keys MUST be declared here for `sam local --env-vars env.json` to
    # inject them: SAM's env-vars file can only *override* variables already
    # declared on the function, so anything missing here is silently dropped and
    # the container falls back to the zod defaults in src/config/index.ts (or, for
    # the default-less queue/topic keys, fails config.parse at init). The real
    # local values (LocalStack/Postgres hostnames, dummy creds) live in env.json;
    # the placeholders below are only used if you forget `--env-vars env.json`.
    Environment:
      Variables:
        NODE_ENV: development
        LOG_LEVEL: info
        DATABASE_URL: overridden-by-env-json
        AWS_ENDPOINT_URL: overridden-by-env-json
        AWS_REGION: ap-south-1
        AWS_ACCESS_KEY_ID: test
        AWS_SECRET_ACCESS_KEY: test
        ORCHESTRATOR_QUEUE_URL: overridden-by-env-json
        DEDUP_QUEUE_URL: overridden-by-env-json
        ANALYSE_QUEUE_URL: overridden-by-env-json
        RULES_QUEUE_URL: overridden-by-env-json
        CONFIDENCE_QUEUE_URL: overridden-by-env-json
        ANALYSIS_COMPLETE_TOPIC_ARN: overridden-by-env-json
        STAGING_BUCKET: doc-staging
        EMBEDDING_PROVIDER: hash
        EMBEDDING_DIM: '1408'
        SIMILARITY_THRESHOLD: '0.95'
        GEMINI_API_KEY: overridden-by-env-json
        GEMINI_MODEL: gemini-2.5-flash

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/lambda/apiHandler.handler
      Events:
        Api:
          Type: HttpApi
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: 'node20'
        External:
          - pg-hstore
        EntryPoints:
          - src/lambda/apiHandler.ts

  OrchestratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/lambda/orchestratorHandler.handler
      Events:
        Sqs:
          Type: SQS
          Properties:
            Queue: !Sub 'arn:aws:sqs:${AWS::Region}:000000000000:orchestrator-queue'
            BatchSize: 5
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: 'node20'
        External:
          - pg-hstore
        EntryPoints:
          - src/lambda/orchestratorHandler.ts

  DedupFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/lambda/dedupHandler.handler
      Events:
        Sqs:
          Type: SQS
          Properties:
            Queue: !Sub 'arn:aws:sqs:${AWS::Region}:000000000000:dedup-queue'
            BatchSize: 5
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: 'node20'
        External:
          - pg-hstore
        EntryPoints:
          - src/lambda/dedupHandler.ts

  ExtractFunction:
    Type: AWS::Serverless::Function
    # Timeout/BatchSize overridden (vs. the shared Globals) because this stage
    # processes SQS records sequentially and each one is a Gemini Vision call —
    # the slowest, most latency-variable stage in the pipeline — so a batch of
    # 5 sequential calls needs more headroom than the 30s default to avoid
    # timing out mid-batch and redriving already-succeeded records.
    Properties:
      Handler: src/lambda/extractHandler.handler
      Timeout: 120
      Events:
        Sqs:
          Type: SQS
          Properties:
            Queue: !Sub 'arn:aws:sqs:${AWS::Region}:000000000000:analyse-queue'
            BatchSize: 2
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: 'node20'
        External:
          - pg-hstore
        EntryPoints:
          - src/lambda/extractHandler.ts

  RulesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/lambda/rulesHandler.handler
      Events:
        Sqs:
          Type: SQS
          Properties:
            Queue: !Sub 'arn:aws:sqs:${AWS::Region}:000000000000:rules-queue'
            BatchSize: 5
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: 'node20'
        External:
          - pg-hstore
        EntryPoints:
          - src/lambda/rulesHandler.ts

  ConfidenceFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/lambda/confidenceHandler.handler
      Events:
        Sqs:
          Type: SQS
          Properties:
            Queue: !Sub 'arn:aws:sqs:${AWS::Region}:000000000000:confidence-queue'
            BatchSize: 5
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: 'node20'
        External:
          - pg-hstore
        EntryPoints:
          - src/lambda/confidenceHandler.ts
